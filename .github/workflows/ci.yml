name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f index.html
          test -f _headers
          test -f _redirects
          test -f functions/api/health.js
          test -f functions/api/github-stats.js
          test -f og-image.jpg
          test -f site.webmanifest
          test -f public/favicon.svg
          test -f README.md
          test -f AGENTS.md
          test -f DEPLOY.md
          test -f wrangler.toml
          test -f .cursor/environment.json
          test -f .github/workflows/ci.yml
      - name: Check for committed secret material
        run: |
          ! grep -RInE '(api[_-]?key|secret|token|password)\s*[:=]\s*["'\'']?[A-Za-z0-9_\-]{8,}' \
            --exclude-dir=.git \
            --exclude-dir=.wrangler \
            --exclude='*.md' \
            --exclude='*.yml' \
            --exclude='*.yaml' \
            .
